<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Letteralizing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&family=Antonio:wght@400;500;600&display=swap">
<style>
/* Layout: moldura de celular (430px) com telas empilhadas; login, home rolável, gaveta lateral e menu em arco acima do botão +. */
:root{
  --blue:#4f6eff; --pink:#ff62c6; --violet:#9a62e8; --rose:#f0386b;
  --sky:#b9d9ff; --ink:#444252; --night:#1b1646; --white:#ffffff;
  --link:#6a7cf5; --tag:#4a56e8;
  --grad-h:linear-gradient(90deg,var(--blue),var(--pink));
  --grad-title:linear-gradient(90deg,#9a62e8,#e468d6);
  --f-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Open Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-display);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:3px solid #ffe27a;outline-offset:2px}

.stage{height:100%;display:grid;place-items:center}
.phone{position:relative;width:100%;height:100%;max-width:430px;overflow:hidden;background:#fff;isolation:isolate}
@media (min-width:560px){
  .phone{height:min(100%,900px);border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 8px #2a2360}
}

.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(var(--dx,0px)) scale(1.025);
  transition:opacity .45s ease,transform .5s cubic-bezier(.22,1,.36,1),visibility 0s linear .5s}
.screen.active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.screen.no-anim{transition:none!important}

.gtext{background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* ---------- LOGIN ---------- */
#login{background:linear-gradient(180deg,#3b5bfb 0%,#7a78fb 34%,#c08ffc 68%,#f8a8ff 100%);overflow-y:auto}
.sketch{position:absolute;inset:0;pointer-events:none;overflow:hidden;background:url(stars.png) center top/cover no-repeat}
.sketch svg{position:absolute}
.login-in{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(14px,3.5dvh,36px) 20px clamp(20px,5dvh,48px)}
.login-planet{width:min(64%,38dvh);height:auto}
.login-logo{width:96%;height:auto;margin-top:-2%}
.login-form{width:80%;display:flex;flex-direction:column;gap:clamp(10px,2.2dvh,20px);margin-top:clamp(12px,3.4dvh,36px)}
.field{position:relative;display:flex;align-items:center;height:clamp(50px,6.4dvh,62px);border-radius:999px;border:4px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--blue),var(--pink)) border-box}
.field svg{width:30px;height:30px;color:var(--blue);margin-left:16px;flex:none}
.field input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;padding:0 16px 0 14px;font:600 22px var(--f-display);color:#5a50d8}
.field .ph{position:absolute;left:68px;pointer-events:none;font:600 22px var(--f-display);transition:opacity .15s}
.field input:focus+.ph,.field input:not(:placeholder-shown)+.ph{opacity:0}
.field .eye{flex:none;width:52px;height:100%;display:grid;place-items:center;color:var(--rose);margin-right:10px;position:relative;z-index:1}
.field .eye svg{width:34px;height:24px;margin:0;color:inherit}
.field .eye .eye-on{display:none}
.field .eye[aria-pressed="true"] .eye-on{display:block}
.field .eye[aria-pressed="true"] .eye-off{display:none}
.field:focus-within{box-shadow:0 0 0 4px rgba(255,255,255,.45)}
.field.bad{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.login-err{min-height:0;margin:-4px 0 0;align-self:center;background:#fff;color:var(--rose);font:600 14px var(--f-display);padding:0 14px;border-radius:999px;max-height:0;opacity:0;overflow:hidden;transition:all .25s}
.login-err.on{max-height:40px;padding:6px 14px;opacity:1}
.row{display:grid;grid-template-columns:.8fr 1.2fr;gap:12px}
.gbtn{display:grid;place-items:center;text-align:center;border-radius:28px;background:var(--grad-h);color:#fff;font:600 21px/1.35 var(--f-display);min-height:clamp(48px,6.2dvh,60px);padding:6px 12px;box-shadow:0 6px 16px rgba(80,60,200,.22);transition:transform .15s,filter .15s}
.gbtn:active{transform:scale(.97)}
.gbtn:hover{filter:brightness(1.06)}
.gbtn.small{font-size:19px;line-height:1.2}
.gbtn[disabled]{filter:saturate(.8);opacity:.85;cursor:wait}
.social{display:flex;gap:7%;padding-left:8%}
.soc{width:clamp(46px,6.6dvh,60px);aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(60,40,160,.2);transition:transform .15s}
.soc:active{transform:scale(.93)}
.soc svg{width:56%;height:56%}
.reg{align-self:center;width:84%;min-height:clamp(54px,7.6dvh,72px);font-size:clamp(28px,4.2dvh,36px);margin-top:clamp(4px,1.8dvh,18px)}

/* ---------- HOME ---------- */
#home{background:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hdr{position:relative;background:linear-gradient(100deg,#4f6eff 0%,#a266e0 52%,#ff62c6 100%);padding:14px 16px 34px}
.hdr-top{position:relative;display:flex;align-items:center;justify-content:space-between;height:84px}
.hdr-planet{width:58px;height:auto;margin-left:-4px}
.hdr-logo{position:absolute;left:50%;top:50%;width:min(52%,230px);height:auto;transform:translate(-50%,-52%)}
.hdr-actions{display:flex;align-items:center;gap:0;color:#fff}
.hdr-actions button{width:34px;height:40px;display:grid;place-items:center;position:relative}
.hdr-actions svg{width:29px;height:29px}
.dot{position:absolute;top:5px;left:12px;width:12px;height:12px;border-radius:50%;background:#ff3f5f}
.pills{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.05fr);gap:8px;margin-top:10px}
.pill{height:36px;min-width:0;white-space:nowrap;border:2.5px solid #fff;border-radius:999px;color:#fff;font:600 13px var(--f-display);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.pill[aria-pressed="true"]{background:#fff;color:#7a5cf0}
.search{padding:0 5px;gap:6px;background:rgba(255,255,255,.08)}
.search .mag{flex:none;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#c25ee0}
.search .mag svg{width:15px;height:15px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:#fff;font:600 14px var(--f-display)}
.search:focus-within{background:rgba(255,255,255,.22)}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:20px;color:#fff}

.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:20px 16px 0}
.sec-h h2{margin:0;font:700 clamp(28px,8vw,38px)/1 var(--f-display);white-space:nowrap;position:relative;padding-bottom:14px}
.sec-h h2::after{content:"";position:absolute;left:8px;bottom:0;width:92px;height:3px;background:var(--grad-h)}
.sec-h p{margin:0 0 16px;min-width:0;font:700 12px/1.25 var(--f-display);color:var(--link);text-align:right}
.book{display:grid;grid-template-columns:31% 1fr;column-gap:10px;padding:14px 14px 4px 14px;align-items:start}
.cover{position:relative;aspect-ratio:.69;border-radius:9px;border:3px solid transparent;
  background:linear-gradient(#404040,#404040) padding-box,linear-gradient(160deg,var(--blue),var(--pink)) border-box;display:grid;place-items:center;overflow:hidden}
.cover svg{width:86%;height:auto}
.cap{margin:6px 0 0;text-align:center;font:600 12px/1.25 var(--f-display);color:#8b6fe6}
.cap span{display:block;color:#c260d6}
.info{min-width:0}
.info h3{margin:-2px 0 0;font:700 clamp(19px,5.2vw,23px)/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .au{margin:2px 0 6px;font:600 15px var(--f-display);color:#7b78f0}
.bubble{background:var(--sky);border-radius:20px;padding:11px 14px 10px;font-family:var(--f-body)}
.bubble p{margin:0;font-size:12.5px;line-height:1.38;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tags{margin-top:6px;font:700 11.5px var(--f-body);color:var(--tag);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:12px;justify-content:flex-end;margin:-12px 24px 0 0;position:relative}
.stat{display:flex;flex-direction:column;align-items:center;font:400 14px/1.1 var(--f-body);color:#555;min-width:26px}
.stat svg{width:25px;height:25px}
.like svg{color:var(--rose);transition:transform .25s cubic-bezier(.34,1.8,.5,1)}
.like[aria-pressed="false"] svg{color:#ff7d9f;opacity:.75}
.like.pop svg{transform:scale(1.35)}
.cmt svg{color:#4f5bf0}
.empty{padding:36px 24px;text-align:center;font:600 16px var(--f-display);color:#9a82e8}

/* nav + botão + */
.fab-scrim{position:absolute;inset:0 0 76px 0;z-index:25;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s linear .3s}
.fab-scrim.on{opacity:1;visibility:visible;transition-delay:0s}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:30;height:76px;background:#fff;display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:0 -4px 20px rgba(110,80,200,.12);border-radius:26px 26px 0 0}
.nav .n{flex:1;display:grid;place-items:center;height:100%;color:var(--rose)}
.nav .n svg{width:34px;height:34px;transition:transform .15s}
.nav .n:active svg{transform:scale(.9)}
.nav .gap{flex:0 0 96px}
.fab-wrap{position:absolute;left:50%;top:-34px;width:68px;height:68px;margin-left:-34px}
.fab-wrap::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:#fff;box-shadow:0 -6px 14px rgba(110,80,200,.1)}
.fab{position:relative;width:68px;height:68px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(240,56,107,.4);transition:transform .35s cubic-bezier(.34,1.6,.5,1)}
.fab svg{width:38px;height:38px}
.fab-wrap.open .fab{transform:rotate(135deg)}
.fab-pill{position:absolute;left:50%;top:50%;z-index:2;height:42px;padding:0 20px;border-radius:999px;background:var(--rose);color:#fff;font:600 19px var(--f-display);white-space:nowrap;box-shadow:0 8px 18px rgba(240,56,107,.35);
  transform:translate(-50%,-50%) scale(.1);opacity:0;pointer-events:none;transition:transform .22s ease-in,opacity .18s ease-in}
.fab-wrap.open .fab-pill{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1);opacity:1;pointer-events:auto;
  transition:transform .6s cubic-bezier(.3,1.75,.5,1) var(--d),opacity .2s ease var(--d)}
.fab-wrap.open .fab-pill:active{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.94)}
.bub{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff 0 12%,rgba(255,255,255,.35) 13% 100%);border:2px solid rgba(240,56,107,.5);opacity:0;pointer-events:none}
.fab-wrap.open .bub{animation:bub .9s cubic-bezier(.2,.7,.3,1) var(--d) forwards}
@keyframes bub{0%{transform:translate(0,0) scale(.2);opacity:0}25%{opacity:.9}100%{transform:translate(var(--bx),var(--by)) scale(1);opacity:0}}

/* ---------- GAVETA ---------- */
.drawer-scrim{position:absolute;inset:0;z-index:39;background:rgba(27,22,70,.38);opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.drawer-scrim.on{opacity:1;visibility:visible;transition-delay:0s}
.drawer{position:absolute;top:0;right:0;bottom:0;z-index:40;width:62%;min-width:250px;background:linear-gradient(180deg,#5870ff 0%,#9a6ae8 45%,#f862c4 100%);
  transform:translateX(104%);visibility:hidden;transition:transform .5s cubic-bezier(.22,1,.36,1),visibility 0s linear .5s;box-shadow:-14px 0 40px rgba(27,22,70,.35);display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;transition-delay:0s}
.d-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:12px 16px 8px;display:flex;flex-direction:column;align-items:center}
.d-scroll::-webkit-scrollbar{display:none}
.d-close{position:relative;z-index:2;align-self:flex-start;width:44px;height:44px;display:grid;place-items:center;color:#fff;margin-left:-6px}
.d-close svg{width:31px;height:31px}
.d-planet{width:min(70%,150px);height:auto;margin-top:-18px;pointer-events:none}
.d-logo{width:100%;height:auto;margin-top:-2px}
.adm-chip{margin-top:8px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.7);color:#fff;font:600 12px var(--f-display);padding:3px 12px;border-radius:999px}
.d-list{width:100%;display:flex;flex-direction:column;gap:clamp(7px,1.2dvh,11px);margin-top:clamp(10px,2dvh,18px)}
.d-item{height:clamp(36px,4.7dvh,46px);flex:none;border-radius:999px;background:#fff;font:600 clamp(16px,2.3dvh,20px) var(--f-display);box-shadow:0 4px 10px rgba(50,30,140,.14);
  opacity:0;transform:translateX(26px);transition:opacity .3s ease,transform .3s ease,filter .15s}
.drawer.on .d-item{opacity:1;transform:none;transition:opacity .45s ease calc(.12s + var(--i)*.04s),transform .55s cubic-bezier(.22,1,.36,1) calc(.12s + var(--i)*.04s)}
.d-item:active{filter:brightness(.96)}
.d-soc{display:flex;flex-direction:column;gap:6px;margin-top:clamp(12px,2.6dvh,26px);color:#fff;font:600 17px var(--f-display);align-self:flex-start;padding-left:4px}
.d-soc div{display:flex;align-items:center;gap:12px}
.d-soc svg{width:28px;height:28px}
.d-cta{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:clamp(12px,2.4dvh,22px)}
.d-cta button{height:clamp(40px,5.2dvh,48px);border:2.5px solid #fff;border-radius:999px;color:#fff;font:600 clamp(17px,2.5dvh,21px) var(--f-display)}
.d-foot{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:8px 18px 14px;color:#fff}
.d-foot svg{width:34px;height:34px}

/* ---------- TOAST ---------- */
.toast{position:absolute;left:50%;top:14px;z-index:60;max-width:88%;transform:translate(-50%,-140%);background:var(--night);color:#fff;font:600 14px/1.3 var(--f-display);padding:10px 18px;border-radius:999px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .4s cubic-bezier(.34,1.5,.5,1);pointer-events:none}
.toast.on{transform:translate(-50%,0)}

/* ---------- APPBAR GLOBAL (menu inferior + botão +) ---------- */
.appbar{position:absolute;inset:0;z-index:25;pointer-events:none;transition:visibility 0s}
.appbar .nav,.appbar .fab-scrim.on{pointer-events:auto}
.appbar .nav{transition:transform .5s cubic-bezier(.22,1,.36,1)}
.appbar.off{visibility:hidden;transition:visibility 0s linear .5s}
.appbar.off .nav{transform:translateY(110%)}

/* ---------- HUB: Feed · Communities · Trends ---------- */
.phdr{position:relative;height:224px;display:flex;flex-direction:column;align-items:center;padding-top:14px;transition:height .45s cubic-bezier(.22,1,.36,1)}
.phdr.compact{height:186px}
.phdr .blob{position:absolute;inset:0;width:100%;height:100%}
.p-back{position:absolute;left:10px;top:8px;z-index:2;width:44px;height:44px;display:grid;place-items:center;color:#fff}
.p-back svg{width:34px;height:34px}
.p-actions{position:absolute;top:8px;right:12px;z-index:2}
.crown-btn svg{width:31px;height:31px}
.avatar{position:relative;width:92px;height:92px;flex:none;transition:width .45s cubic-bezier(.22,1,.36,1),height .45s cubic-bezier(.22,1,.36,1)}
.phdr.compact .avatar{width:68px;height:68px}
.avatar>svg{width:100%;height:100%;border-radius:50%;box-shadow:0 4px 14px rgba(40,20,120,.25)}
.online{position:absolute;left:1%;top:3%;width:23%;aspect-ratio:1;border-radius:50%;background:#00c060;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.pname{position:relative;margin:5px 0 0;color:#fff;font:700 26px/1.1 var(--f-body);transition:font-size .45s cubic-bezier(.22,1,.36,1);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phdr.compact .pname{font-size:19px}
.puser{position:relative;margin-top:5px;padding:1px 20px;border:2.5px solid #fff;border-radius:999px;color:#fff;font:700 12px/1.5 var(--f-body)}
.hub-search{display:flex;align-items:center;gap:8px;height:38px;width:80%;margin:16px auto 0;padding:0 5px;border-radius:999px;background:linear-gradient(90deg,#c3c8fb,#fbc0ea)}
.hub-search .mag{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.hub-search .mag svg{width:16px;height:16px}
.hub-search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:600 14px var(--f-display);color:#4a43a8}
.hub-search:focus-within{box-shadow:0 0 0 3px rgba(79,110,255,.35)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 10px 0}
.tab{height:36px;min-width:0;border-radius:999px;border:3px solid transparent;font:700 14px var(--f-body);color:#a35fe2;white-space:nowrap;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--blue),var(--pink)) border-box;transition:transform .15s}
.tab:active{transform:scale(.96)}
.tab[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,#5b6dff,#f562c3) border-box}
.panel{padding-bottom:8px}
.panel.in-r{animation:panelR .45s cubic-bezier(.22,1,.36,1)}
.panel.in-l{animation:panelL .45s cubic-bezier(.22,1,.36,1)}
@keyframes panelR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes panelL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.ava{flex:none;border-radius:50%}

/* feed */
.post{padding:20px 16px 12px}
.post+.post{border-top:1px solid #ebe6f8}
.p-title{margin:0;font:500 clamp(28px,8.2vw,33px)/1.08 'Antonio',var(--f-display);letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.p-by{margin:4px 0 8px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font:600 14px var(--f-body);color:#8a86f0}
.p-by b{font-weight:700}
.chip-off{background:var(--grad-h);color:#fff;font:700 11px var(--f-body);padding:3px 12px;border-radius:999px}
.p-text{margin:0;font:400 14px/1.5 var(--f-body);color:#666;white-space:pre-line}
.more{display:inline;font:inherit;color:#777}
.p-img{margin-top:14px;border-radius:26px;border:4px solid transparent;aspect-ratio:var(--ar,1);display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(#404040,#404040) padding-box,linear-gradient(180deg,var(--blue),var(--pink)) border-box}
.p-img svg{width:70%;height:auto;max-height:80%}
.p-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px;align-items:start}
.p-left{min-width:0}
.date{font:700 15px var(--f-body);color:#8d97f6}
.p-cmt{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--sky);border-radius:999px;padding:5px 12px 5px 5px;max-width:100%}
.p-cmt .ava{width:30px;height:30px}
.ct{min-width:0;flex:1;display:flex;flex-direction:column;font:400 11.5px/1.25 var(--f-body);color:#333}
.ct b{color:#4f6eff}
.ct span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.see{flex:none;font:700 12px var(--f-body);color:#7d8af5}
.acts{display:flex;gap:10px;align-items:flex-start}
.act{display:flex;flex-direction:column;align-items:center;min-width:28px;font:700 12px/1.3 var(--f-body);color:#666}
.act svg{width:26px;height:26px;color:var(--rose)}
.act.save svg{fill:none;width:28px;height:28px}
.act.save[aria-pressed="true"] svg{fill:currentColor}
.act[data-like] svg{transition:transform .25s cubic-bezier(.34,1.8,.5,1)}
.act[data-like][aria-pressed="false"] svg{color:#ff7d9f;opacity:.75}
.act.pop svg{transform:scale(1.35)}

/* communities */
.bar{height:5px;border-radius:3px;background:var(--grad-h);width:49%;margin:26px 0 0 14px}
.comm{display:grid;grid-template-columns:33% minmax(0,1fr);gap:12px;padding:20px 16px;border-bottom:2px solid #d4d2e2}
.comm .cover{aspect-ratio:.76;align-self:start}
.comm .cover svg{width:88%}
.c-name{margin:0;font:700 clamp(19px,5.4vw,22px)/1.15 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-own{margin:2px 0 6px;font:400 14px var(--f-body);color:#7b88f2}
.c-own b{font-weight:700;color:#5d6cf0}
.c-desc{margin:0;font:400 13px/1.45 var(--f-body);color:#666;display:-webkit-box;-webkit-line-clamp:5;line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.c-stat{display:flex;flex-direction:column;align-items:center;font:700 11.5px/1.25 var(--f-body);color:#666;text-align:center}
.c-stat svg{width:30px;height:24px;color:var(--blue)}
.c-on{font:700 10.5px var(--f-body);color:#00b050;display:flex;align-items:center;gap:4px;white-space:nowrap}
.c-on i{width:7px;height:7px;border-radius:50%;background:#00c060}
.age{width:30px;height:30px;border-radius:50%;background:var(--rose);color:#fff;font:700 12px var(--f-body);display:grid;place-items:center}
.c-cta{flex:none;margin-left:auto;align-self:center;height:34px;padding:0 12px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--pink));color:#fff;font:700 13px var(--f-body);border:2.5px solid transparent;white-space:nowrap;transition:transform .15s}
.c-cta:active{transform:scale(.95)}
.c-cta.req{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--blue),var(--pink)) border-box;color:#a35fe2}

/* trends */
.t-h{display:flex;align-items:center;gap:12px;padding:24px 16px 6px}
.t-h h2{margin:0;font:700 22px var(--f-body);color:#3a3947;white-space:nowrap}
.t-h i{flex:1;height:5px;border-radius:3px;background:var(--grad-h)}
.chat{display:block;width:calc(100% - 20px);margin:10px 10px 0;text-align:left;background:var(--sky);border-radius:28px;padding:12px 16px 22px;color:inherit}
.c-sub{display:block;margin-bottom:6px;font:700 22px/1.15 var(--f-display);color:#4f6eff}
.msg{display:flex;gap:6px;align-items:flex-start;margin:4px 0;font:400 14px/1.4 var(--f-body);color:#333}
.mt{min-width:0;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mt b{color:#111}
.crown{flex:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--blue);display:grid;place-items:center;box-shadow:inset 0 0 0 2px #e8e3ff}
.crown.rose{border-color:var(--rose);box-shadow:inset 0 0 0 2px #ffe0f3}
.crown svg{width:13px;height:13px}
.chat-meta{display:flex;justify-content:flex-end;align-items:flex-end;gap:16px;margin:-18px 36px 0 0;position:relative}
.live{display:flex;flex-direction:column;align-items:center;font:700 11px/1 var(--f-body);color:#666;gap:2px}
.live svg{width:30px;height:30px;color:#4f5bf0}
.dots{font:700 20px/1 var(--f-body);color:#4f5bf0;letter-spacing:2px;padding:0 4px 8px}
.topic{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;background:#ffb0f2;border-radius:26px;padding:14px 16px 24px 14px;margin:10px 10px 0;align-items:start}
.topic .ava{width:48px;height:48px;margin-top:6px}
.tp-title{margin:0;display:flex;align-items:center;gap:6px;font:700 clamp(16px,4.8vw,19px)/1.2 var(--f-display);color:var(--rose)}
.tp-title>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-sub{display:flex;justify-content:space-between;gap:8px;font:600 10px/1.3 var(--f-body);color:var(--rose)}
.tp-sub span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-tags{font-weight:700}
.tp-text{margin:6px 0 0;font:400 13px/1.4 var(--f-body);color:#444;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tp-acts{display:flex;justify-content:flex-end;gap:12px;margin:-18px 30px 0 0;position:relative}
.empty-h{padding:36px 24px;text-align:center;font:600 16px var(--f-display);color:#9a82e8}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important;animation-delay:0s!important}
}

/* ---------- POP DO MENU INFERIOR (3 bonequinhos) ---------- */
.nwrap{flex:1;position:relative;height:100%;display:grid;place-items:center}
.nwrap>.n{width:100%}
.nav .n[aria-expanded="true"] svg{transform:scale(1.14)}
.pop-anchor{position:absolute;left:50%;top:0;width:0;height:0}
.pop-anchor.open .fab-pill{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1);opacity:1;pointer-events:auto;
  transition:transform .6s cubic-bezier(.3,1.75,.5,1) var(--d),opacity .2s ease var(--d)}
.pop-anchor.open .fab-pill:active{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.94)}
.pop-anchor.open .bub{animation:bub .9s cubic-bezier(.2,.7,.3,1) var(--d) forwards}

/* ---------- DETALHE DA HISTÓRIA ---------- */
.book .cover,.book h3[role="button"]{cursor:pointer}
.book .cover:active{transform:scale(.98)}
#book{background:#fff}
#book .scroll{padding-bottom:40px}
.bk-page{position:relative;min-height:100%;overflow:hidden}
.bk-stars{position:absolute;inset:0;pointer-events:none;background:url(stars-pink.png) top center/100% auto repeat-y}
.bk-hdr{position:relative;height:250px}
.bk-hdr::after{content:"";position:absolute;inset:0;background:url(stars.png) top center/100% auto no-repeat;pointer-events:none}
.bk-blob{position:absolute;inset:0;width:100%;height:100%}
.bk-cover{position:absolute;left:50%;top:33px;width:33%;transform:translateX(-50%);z-index:1;box-shadow:0 8px 22px rgba(60,40,160,.3)}
.bk-main{position:relative}
.bk-t{display:flex;align-items:center;gap:8px;margin-top:4px}
.bk-t i{flex:1 1 14px;min-width:10px;height:4px;background:var(--grad-h)}
.bk-t h1{margin:0;flex:0 1 auto;max-width:84%;text-align:center;font:700 clamp(26px,7.6vw,34px)/1.1 var(--f-display)}
.bk-au{margin:2px 0 0;text-align:center;font:700 clamp(19px,5.4vw,24px) var(--f-display);color:#7b78f0}
.bk-stats{display:flex;justify-content:center;align-items:flex-start;gap:22px;margin-top:10px}
.bk-stats>*{display:flex;flex-direction:column;align-items:center;min-width:44px;font:400 14px/1.15 var(--f-body);color:#555}
.bk-stats svg{width:30px;height:30px}
.bk-stats .s-like svg{color:var(--rose);transition:transform .25s cubic-bezier(.34,1.8,.5,1)}
.bk-stats .s-like[aria-pressed="false"] svg{color:#ff7d9f;opacity:.75}
.bk-stats .s-like.pop svg{transform:scale(1.35)}
.bk-stats .s-view svg{color:#4f5bf0}
.bk-stats .s-age svg{color:var(--rose)}
.bk-stats .s-send svg{color:#4f6eff}
.bk-syn{position:relative;margin:16px 14px 0;border-radius:34px;padding:20px 22px 0;
  background:linear-gradient(180deg,rgba(176,184,255,.93) 0%,rgba(228,196,246,.93) 55%,rgba(255,190,232,.93) 100%)}
.syn-clip{position:relative;overflow:hidden;--f:44px;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - var(--f)),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - var(--f)),transparent)}
.syn-t{margin:0;font:400 16px/1.42 var(--f-body);color:#24203a;white-space:pre-line;overflow-wrap:anywhere}
.syn-grip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;height:38px;touch-action:none;cursor:grab;color:rgba(80,60,160,.5)}
.syn-grip i{width:58px;height:6px;border-radius:99px;background:rgba(80,60,160,.32)}
.syn-grip svg{width:20px;height:12px;transition:transform .3s}
.bk-syn.open .syn-grip svg{transform:rotate(180deg)}
.bk-syn.short{padding-bottom:20px}
.bk-syn.short .syn-grip{display:none}
.bk-syn.short .syn-clip{-webkit-mask-image:none;mask-image:none}
.bk-h3{margin:20px 18px 6px;font:600 clamp(24px,6.6vw,30px)/1.1 var(--f-display)}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px;padding:0 16px}
.chip{height:34px;padding:0 14px;border:3px solid transparent;border-radius:999px;font:600 16px var(--f-display);display:grid;place-items:center;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--violet),#e468d6) border-box}
.chip.more{border:0;background:var(--grad-h);color:#fff;padding:0 18px}
.warn-row{display:flex;align-items:flex-end;gap:10px;padding:0 16px}
.warn-row .chips{flex:1;padding:0}
.warn{height:36px;padding:0 20px;border-radius:999px;background:var(--rose);color:#fff;font:600 17px var(--f-display);display:grid;place-items:center}
.report{flex:none;display:flex;flex-direction:column;align-items:center;color:var(--rose);font:600 12px/1 var(--f-display)}
.report svg{width:34px;height:34px;margin-bottom:2px}
.bk-ch{position:relative;text-align:center;margin-top:26px;padding:0 10px}
.bk-ch::before,.bk-ch::after{content:"";position:absolute;top:50%;height:4px;width:22%}
.bk-ch::before{left:0;background:linear-gradient(90deg,var(--blue),var(--pink))}
.bk-ch::after{right:0;background:linear-gradient(90deg,var(--blue),var(--pink))}
.bk-ch h2,.bk-ch p{margin:0;font:700 clamp(26px,7.4vw,34px)/1.15 var(--f-display)}
.chaps{padding:14px 10px 0 14px}
.chap{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chap-pill{flex:1;min-width:0;height:54px;border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 14px 0 16px;text-align:left;background:var(--sky)}
.chap:nth-child(even) .chap-pill{background:#ffb3ec}
.ch-n{flex:none;font:700 16px var(--f-display);color:var(--tag)}
.chap:nth-child(even) .ch-n{color:var(--rose)}
.ch-t{flex:1;min-width:0;font:400 16px var(--f-body);color:#2b2640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-w{flex:none;font:700 10px/1.15 var(--f-display);color:var(--violet);text-align:center}
.ch-st{flex:none;display:flex;gap:6px}
.ch-st span{display:flex;flex-direction:column;align-items:center;width:28px;font:400 11px/1 var(--f-body);color:#666}
.ch-st svg{width:24px;height:24px;color:#8c8c8c;margin-bottom:2px}
.bk-end{margin:18px 30px 6px;text-align:center;font:600 19px/1.3 var(--f-display);color:#9a82e8}

/* ---------- PERFIL ---------- */
#profile{background:#fff}
.pf-hdr{position:relative;height:130px}
.pf-blob{position:absolute;inset:0;width:100%;height:100%}
.pf-id{position:relative;display:flex;align-items:flex-end;gap:14px;margin-top:-78px;padding:0 14px 0 18px}
.pf-ava{flex:none;width:134px;height:134px;border-radius:50%;border:7px solid #fff;background:#fff;box-shadow:0 4px 14px rgba(40,20,120,.18);overflow:hidden}
.pf-ava svg{width:100%;height:100%}
.pf-nm{min-width:0;padding-bottom:6px}

.pf-edit{width:28px;height:28px;display:grid;place-items:center;color:#222}
.pf-edit svg{width:24px;height:24px}

.pf-badges{height:42px;margin-top:4px;border:4px solid transparent;border-radius:999px;background:linear-gradient(#fff,#fff) padding-box,var(--grad-h) border-box}

.pf-stats::after{content:"";position:absolute;left:0;right:0;top:20px;height:4px;background:var(--grad-h)}
.pf-stats b{font-size:clamp(12px,3.4vw,14px)}
.pf-tabs{display:flex;gap:18px;overflow-x:auto;padding:0 18px;margin-top:22px;scrollbar-width:none}
.pf-tabs::-webkit-scrollbar{display:none}
.pf-tab{flex:none;position:relative;padding-bottom:8px;font:600 clamp(16px,4.4vw,19px) var(--f-display);white-space:nowrap}
.pf-tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--grad-h)}
.pf-h{margin:24px 22px 0;font:700 clamp(22px,6.2vw,27px)/1.15 var(--f-body);color:#333;position:relative;padding-bottom:10px;width:fit-content;max-width:calc(100% - 44px)}
.pf-h::after{content:"";position:absolute;left:4px;bottom:0;width:92px;height:4px;background:var(--grad-h)}
.pf-band{position:relative;margin-top:14px}
.pf-band::before{content:"";position:absolute;left:0;right:0;top:22px;height:60px;background:var(--sky)}
.pf-band.pink::before{background:#ffb8ee}
.pf-row{position:relative;display:flex;gap:12px;overflow-x:auto;padding:0 60px 0 24px;scrollbar-width:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,transparent var(--ma,0px),#000 var(--mb,0px),#000 calc(100% - 64px),transparent calc(100% - 44px));mask-image:linear-gradient(90deg,transparent var(--ma,0px),#000 var(--mb,0px),#000 calc(100% - 64px),transparent calc(100% - 44px))}
.pf-band.can-prev .pf-row{--ma:36px;--mb:60px}

.pf-prev svg{width:30px;height:34px;transform:scaleX(-1)}
.pf-band.can-prev .pf-prev{opacity:1;pointer-events:auto}
.pf-row::-webkit-scrollbar{display:none}
.pf-bk{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;text-align:center;font:700 12px/1.25 var(--f-display);color:#666}
.pf-bk .cover{width:100%}
.pf-bk .cover svg{width:90%}
.pf-bk span{margin-top:5px}
button.pf-bk{cursor:pointer}
button.pf-bk:active .cover{transform:scale(.97)}
.pf-next{position:absolute;right:12px;top:34px;width:44px;height:36px;display:grid;place-items:center;color:#fff}
.pf-next svg{width:30px;height:34px}
.pf-posts{padding:14px 12px 0}
.pf-post{position:relative;display:grid;grid-template-columns:66px 1fr;gap:12px;width:100%;text-align:left;margin-bottom:16px;padding:14px 16px 12px 14px;border-radius:30px;background:var(--sky)}
.pf-post .ava{width:66px;height:66px;border-radius:50%}
.pf-post b{display:block;font:700 19px var(--f-body);color:#4a56e8}
.pf-post p{margin:2px 0 0;font:400 13px/1.35 var(--f-body);color:#333;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pf-post .rt{position:absolute;top:-10px;right:34px;width:34px;height:34px;color:#4f6eff}
.pf-post .pc{grid-column:1/-1;display:flex;justify-content:flex-end;gap:14px;margin-top:2px}
.pf-post .pc span{display:flex;flex-direction:column;align-items:center;font:700 11px/1 var(--f-body);color:#666}
.pf-post .pc svg{width:24px;height:24px;margin-bottom:2px}
.pf-post .pc .pm svg{color:#4f5bf0}
.pf-post .pc .ph svg{color:var(--rose)}
.post.flash{animation:pflash 1.8s ease}
@keyframes pflash{0%,60%{box-shadow:inset 0 0 0 3px var(--pink);background:rgba(255,98,198,.1)}100%{box-shadow:inset 0 0 0 3px transparent;background:transparent}}

/* ---------- COROA / MENU ADMIN ---------- */
.crown-pop{position:absolute;inset:0;z-index:38;visibility:hidden;pointer-events:none}

.crown-pop.on .bub{animation:bub .9s cubic-bezier(.2,.7,.3,1) var(--d) forwards}

.us-n{margin:0;font:700 15px/1.25 var(--f-body);color:#4f5bf0;overflow-wrap:anywhere}
.us-st{flex:none;height:26px;padding:0 14px;border-radius:999px;background:linear-gradient(90deg,#5672ff,#ee64cc);color:#fff;font:700 12px/26px var(--f-body)}
.us-m{margin:2px 0 0;font:400 12px var(--f-body);color:#5a66ee;overflow-wrap:anywhere}
.pub{background:var(--sky);border-radius:36px;padding:18px 18px 22px;margin:22px 24px 0}
.pub-h{display:flex;align-items:center;gap:12px;font:700 13px var(--f-body);color:#4f5bf0}
.pub-h i{font-style:normal;height:28px;padding:0 16px;border-radius:999px;background:#4f6eff;color:#fff;font-size:12px;line-height:28px}
.ad-in{display:block;width:100%;height:40px;margin-top:12px;padding:0 16px;border:3px solid #4f6eff;border-radius:999px;background:transparent;font:400 15px var(--f-body);color:#3a45d8;outline:0}
.ad-in::placeholder{color:#6f78ee}
.ad-in:focus,.ed:focus{box-shadow:0 0 0 3px rgba(79,110,255,.3)}
.ad-sel{position:relative}
.ad-sel select{appearance:none;-webkit-appearance:none;cursor:pointer}
.ad-sel svg{position:absolute;right:16px;top:25px;width:18px;height:11px;color:#4f6eff;pointer-events:none}
.ed-box{margin-top:12px;border:3px solid #4f6eff;border-radius:30px;padding:14px 16px 10px}
.ed{min-height:150px;outline:0;border-radius:12px;font:400 15px/1.45 var(--f-body);color:#3a45d8;white-space:pre-wrap;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:#6f78ee}
.tb{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:10px;color:#444}
.tb button{height:28px;min-width:22px;display:grid;place-items:center;color:inherit;font:700 19px/1 Georgia,serif}
.tb svg{width:22px;height:22px}
.tb .sz{display:flex;align-items:center;border:2px solid #4f6eff;border-radius:6px;font:700 12px var(--f-body);color:#333;margin-left:auto}
.tb .sz span{padding:0 10px}
.tb .sz button{height:20px;font:700 13px var(--f-body);padding:0 6px}
.pub-go{display:block;margin:16px auto 0;height:44px;padding:0 40px;border-radius:999px;background:var(--grad-h);color:#fff;font:600 19px var(--f-display);box-shadow:0 6px 16px rgba(80,60,200,.22)}
.pub-go:active{transform:scale(.97)}
</style>

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const toastEl=$('#toast');let toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2200)}
function show(id,dir=0){
  const target=document.getElementById(id);
  document.querySelectorAll('.screen').forEach(s=>{if(s!==target&&s.classList.contains('active'))s.style.setProperty('--dx',(-dir*30)+'px')});
  target.classList.add('no-anim');target.style.setProperty('--dx',(dir*30)+'px');void target.offsetWidth;target.classList.remove('no-anim');
  document.querySelectorAll('.screen').forEach(s=>{const on=s===target;s.classList.toggle('active',on);s.inert=!on});
  closeFab();
}
function setAppbar(on){const a=$('#appbar');a.classList.toggle('off',!on);a.inert=!on}
document.addEventListener('click',e=>{const b=e.target.closest('[data-soon]');if(b){e.preventDefault();toast(b.dataset.soon)}});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Login ===== */
const form=$('#loginForm'),inUser=$('#inUser'),inPass=$('#inPass'),errEl=$('#loginErr');
function fail(msg){
  errEl.textContent=msg;errEl.classList.add('on');
  [$('#fUser'),$('#fPass')].forEach(f=>{f.classList.remove('bad');void f.offsetWidth;f.classList.add('bad')});
}
const btnEye=$('#btnEye');
function setEye(on){btnEye.setAttribute('aria-pressed',String(on));btnEye.setAttribute('aria-label',on?'Hide password':'Show password');inPass.type=on?'text':'password'}
btnEye.addEventListener('click',e=>{e.preventDefault();setEye(inPass.type==='password');inPass.focus({preventScroll:true})});
[inUser,inPass].forEach(i=>i.addEventListener('input',()=>errEl.classList.remove('on')));
form.addEventListener('submit',e=>{
  e.preventDefault();
  const u=inUser.value.trim().toLowerCase(),p=inPass.value;
  if(!u||!p){fail('Please enter your username and password.');return}
  const btn=$('#btnEnter');btn.disabled=true;btn.textContent='Logging in…';
  setTimeout(()=>{
    btn.disabled=false;btn.textContent='Login';
    const user=DB.users.find(x=>x.username===u&&x.password===p);
    if(!user){fail('Incorrect username or password.');return}
    session={id:user.id,username:user.username,role:user.role,name:user.name};
    if(user.role==='admin')AdminSlot.mount($('#adminSlot'),session);
    enterHome();
  },450);
});
function enterHome(){
  $('#admChip').hidden=session.role!=='admin';setAdminUI(session.role==='admin');
  state.q='';state.top=false;$('#inSearch').value='';$('#btnTop').setAttribute('aria-pressed','false');
  renderHome();$('#homeScroll').scrollTop=0;
  $('#pName').textContent=PROFILE.name;$('#pUser').textContent='@'+PROFILE.user;
  show('home');setAppbar(true);
}
$('#btnLogout').addEventListener('click',()=>{
  closeDrawer();closeFab();session=null;setAdminUI(false);form.reset();setEye(false);errEl.classList.remove('on');
  setTimeout(()=>{show('login');setAppbar(false)},250);
});

const state={q:'',top:false};
function bookHTML(b){
  const tags=b.tags.map(t=>'#'+t).join(' ')+'…';
  return `<article class="book" data-id="${b.id}">
    <div><div class="cover" role="button" tabindex="0" aria-label="Open ${esc(b.title)}"><svg aria-hidden="true"><use href="#i-cloud"/></svg></div>
      <p class="cap">Chapters: ${b.chapters}<span>Status: ${b.status}</span></p></div>
    <div class="info"><h3 class="gtext" role="button" tabindex="0">${esc(b.title)}</h3><p class="au">${esc(b.author)}</p>

function setTab(name,anim=true){

$('#hubScroll').addEventListener('click',e=>{
  const t=e.target;

  if(more){const el=more.closest('.post'),d=DB.posts.find(x=>x.id==el.dataset.id),open=more.getAttribute('aria-expanded')==='true';
    el.querySelector('.tx').textContent=open?trunc(d.text,230):d.text;more.textContent=open?'(more)':'(less)';more.setAttribute('aria-expanded',String(!open));return}
  const lk=t.closest('[data-like]');

    lk.classList.add('pop');setTimeout(()=>lk.classList.remove('pop'),220);return}
  const sv=t.closest('[data-save]');
  if(sv){const d=DB.posts.find(x=>x.id==sv.closest('[data-kind]').dataset.id);d.saved=!d.saved;sv.setAttribute('aria-pressed',String(d.saved));if(d.saved)toast('Post salvo (simulação)');return}

const DETAIL={"1": {"age": "+12", "views": 5120, "warn": ["Violence", "Alcohol"], "more": ["storm", "lighthouse", "found-family"], "long": "Quando a luz do farol se apaga pela primeira vez em trezentos anos, a jovem guardiã Alma descobre que o mar guarda o que o mundo esqueceu.\n\nSem ninguém a quem recorrer na ilha, ela encontra no porão do farol um diário de marés escrito por todas as guardiãs que vieram antes dela. Cada página revela uma promessa feita ao oceano e uma dívida que ainda não foi paga. Para reacender a luz, Alma terá de navegar até o Recife dos Sinos, onde os navios naufragados cantam à noite, e decidir se vale a pena lembrar de tudo o que o mar devolve.\n\nEntre contrabandistas, cartógrafos exilados e uma tempestade que parece ter vontade própria, a história fala de herança, de coragem tardia e do preço de manter uma chama acesa para quem nunca vai agradecer."}, "2": {"age": "+14", "views": 3340, "warn": ["Sensitive themes"], "more": ["family", "secrets", "mystery"], "long": "Durante um ano, Beatriz escreve cartas que nunca envia. Até que uma delas recebe resposta, com a letra de alguém que ela julgava perdido.\n\nO remetente não assina, não dá endereço e sempre sabe o que ela escreveu na semana anterior. A cada carta, Beatriz se aproxima de uma verdade que a família inteira prefere deixar guardada na gaveta: o que aconteceu no verão em que seu irmão deixou a cidade sem se despedir.\n\nEntre cafés frios, caixas de correio esquecidas e um carteiro que parece saber demais, ela precisa escolher entre continuar escrevendo para o passado ou finalmente dizer em voz alta o que nunca teve coragem de enviar."}, "3": {"age": "+10", "views": 7860, "warn": ["Violence"], "more": ["maps", "forest", "coming-of-age"], "long": "Entre árvores que tilintam ao vento vive um povo de fadas cartógrafas. Cada capítulo traz um mapa novo e um segredo que ninguém queria achar.\n\nQuando o mapa mais antigo da Floresta de Vidro começa a se redesenhar sozinho, a jovem aprendiz Lume é a única que percebe: as trilhas estão se movendo para esconder algo no centro da mata. Ao lado de um corvo desconfiado e de uma colecionadora de ecos, ela parte para descobrir o que a floresta tenta proteger, ou de quem.\n\nCom paisagens que cantam, bússolas que mentem e amizades que se formam em lugares que não existem no papel, as crônicas seguem o ritmo lento e luminoso de quem aprende que todo mapa também é uma forma de lembrar."}, "4": {"age": "+12", "views": 2210, "warn": ["Alcohol", "Smoking"], "more": ["coffee", "night", "healing"], "long": "A astrônoma Nina abre uma cafeteria que só funciona de madrugada. Seus clientes são insones, poetas e alguém que sabe o nome de todas as estrelas.\n\nEnquanto o inverno avança, ela mantém um caderno com as conversas ouvidas atrás do balcão: o violoncelista que não toca desde a mudança, a taxista que lê o céu pelo retrovisor, o senhor das quatro da manhã que sempre pede o mesmo chá e nunca diz o porquê. Aos poucos, cada história vira uma constelação própria no teto do café.\n\nUm romance calmo, cheio de xícaras quentes e de pequenas coincidências, sobre recomeçar sem pressa e aprender a ficar acordada para quem merece a companhia."}, "5": {"age": "+14", "views": 4480, "warn": ["Violence", "Mild horror"], "more": ["library", "cozy-mystery", "small-town"], "long": "Os livros da biblioteca de Vila Nuvem só mudam de lugar quando chove. O novo bibliotecário decide descobrir quem os arruma e por quê.\n\nEm sua primeira semana, Caetano encontra bilhetes dentro dos volumes, cada um apontando para outra estante, outro corredor, outra pergunta. Uma jovem restauradora, um relojoeiro que nunca devolve nada e uma menina que jura ouvir as páginas sussurrarem tornam-se seus parceiros numa investigação que vai de porões úmidos a mapas esquecidos.\n\nQuanto mais perto chega da resposta, mais a cidade parece ter sido construída em volta de um segredo que depende da chuva para ser contado. Um mistério aconchegante sobre memória, pertencimento e o poder de um lugar onde todo mundo deixou um pouco de si."}};

    <div class="bk-t"><i></i><h1 class="gtext">${esc(b.title)}</h1><i></i></div>

      <button class="syn-grip" id="synGrip" type="button" aria-expanded="false" aria-label="Expand synopsis"><i></i><svg aria-hidden="true"><use href="#i-chev"/></svg></button></div>
    <h2 class="bk-h3 gtext">Tags</h2>
    <div class="chips" id="tagChips">${first.map(t=>chip(t)).join('')}${rest.map(t=>chip(t,1)).join('')}${rest.length?'<button class="chip more" type="button" id="tagMore" aria-expanded="false">More</button>':''}</div>

    <div class="chaps">${chapterRows(b)}</div>
    <p class="bk-end">That's it! Maybe you'll find more if you check it later</p>`;
  $('#bookScroll').scrollTop=0;
  show('book',1);setAppbar(false);
  synInit();
}
/* sinopse expansível: puxe a alça para baixo (ou toque) e tudo abaixo desce junto */
function synInit(){
  const box=$('#bkSyn'),clip=$('#synClip'),t=$('#synT'),grip=$('#synGrip');
  const COLL=168;let full=t.scrollHeight,open=false,drag=false,moved=false,sy=0,sh=0;
  if(full<=COLL+24){box.classList.add('short');clip.style.height='auto';return}
  clip.style.height=COLL+'px';
  const set=(h,anim)=>{
    if(clip.style.height==='auto'){clip.style.height=clip.offsetHeight+'px';void clip.offsetHeight}
    clip.style.transition=anim?'height .45s cubic-bezier(.22,1,.36,1)':'none';
    clip.style.height=h+'px';
    const p=Math.max(0,Math.min(1,(h-COLL)/(full-COLL)));
    clip.style.setProperty('--f',(44*(1-p))+'px');
    const o=h>COLL+(full-COLL)/2;box.classList.toggle('open',o);
  };
  const settle=()=>{open=!open;grip.setAttribute('aria-expanded',String(open));grip.setAttribute('aria-label',open?'Collapse synopsis':'Expand synopsis');set(open?full:COLL,true)};
  clip.addEventListener('transitionend',()=>{if(open&&clip.style.height!=='auto'){clip.style.transition='none';clip.style.height='auto'}});
  grip.addEventListener('pointerdown',e=>{drag=true;moved=false;sy=e.clientY;full=t.scrollHeight;
    if(clip.style.height==='auto')clip.style.height=clip.offsetHeight+'px';
    sh=clip.getBoundingClientRect().height;clip.style.transition='none';try{grip.setPointerCapture(e.pointerId)}catch(_){}});
  grip.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-sy;if(Math.abs(dy)>4)moved=true;if(moved)set(Math.max(COLL,Math.min(full,sh+dy)),false)});
  const end=e=>{if(!drag)return;drag=false;
    if(!moved){settle();return}
    const h=clip.getBoundingClientRect().height,dy=e.clientY-sy,want=dy>0?h>COLL+(full-COLL)*.25:h>COLL+(full-COLL)*.75;
    open=!want;settle()};
  grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);
  grip.addEventListener('click',e=>{if(e.detail===0)settle()});
}

const isMine=b=>b.author===PROFILE.name;
function pfBook(b,clickable){
  const inner=`<div class="cover"><svg aria-hidden="true"><use href="#i-cloud"/></svg></div><span>${esc(b.title)}</span>`;
  return clickable?`<button class="pf-bk" type="button" data-open="${b.id}" aria-label="Open ${esc(b.title)}">${inner}</button>`:`<div class="pf-bk">${inner}</div>`;
}
function renderProfile(){
  const first=PROFILE.name.split(' ')[0];
  $('#pfName').textContent=PROFILE.name;$('#pfUser').textContent='@'+PROFILE.user;$('#pfBio').textContent=PROFILE.bio;
  $('#pfStats').innerHTML=PROFILE.stats.map(x=>`<b>${x[0]}</b>`).join('')+PROFILE.stats.map(x=>`<span>${x[1]}</span>`).join('');
  $('#pfTopH').textContent=`Top ${first} Stories`;$('#pfRevH').textContent=`Reviews of ${first}`;
  $('#pfTopRow').innerHTML=DB.books.filter(isMine).map(b=>pfBook(b,true)).join('');
  $('#pfRevRow').innerHTML=DB.books.filter(b=>!isMine(b)).reverse().map(b=>pfBook(b,false)).join('');

    const p=DB.posts.find(q=>q.id===x.ref);if(!p)return'';

function goFeed(postId){
  setAppbar(true);

  setTimeout(()=>{
    const el=document.querySelector(`#panel-feed .post[data-id="${postId}"]`),sc=$('#hubScroll');
    if(!el)return;
    sc.scrollTo({top:Math.max(0,el.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop-10),behavior:'smooth'});
    el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');

  const pv=e.target.closest('[data-prev]');

const memberOf=u=>DB.members.find(m=>m.user===u);

const ST_LABEL={active:'Active',offline:'Offline',suspended:'Susp',muted:'Muted',banned:'Banned'};
let adTab='reports',adPrev={id:'home',appbar:true};
function adCards(){
  if(adTab==='pub'){const n=DB.posts.filter(p=>p.official).length;
    return `<div class="ad-cards one"><div class="ad-card"><b class="gtext">${n} Total Official Pubs</b><span>Reach: ${pubState.total} Total, ${pubState.since} since last pub</span></div></div>`}
  const pend=DB.reports.filter(r=>r.open).length,res=DB.members.filter(m=>['suspended','muted','banned'].includes(m.status)).length;
  return `<div class="ad-cards"><div class="ad-card"><b class="gtext">${pend} Mod</b><span>Pending</span></div><div class="ad-card"><b class="gtext">${res} Acc</b><span>Restricted</span></div></div>`;
}
function reportHTML(r){
  const p=DB.posts.find(x=>x.id===r.post);
  const body=r.kind==='Comment'?(p&&p.last?p.last.text:''):(p?p.title+' — '+p.text:'');
  return `<article class="rp" data-id="${r.id}"><div class="rp-ch"><span>${esc(r.kind)}</span><span>${esc(r.reason)}</span></div>
    <p class="rp-t">${esc(trunc(body,120)||body)}</p><p class="rp-by">By: @${esc(r.author)} – ${esc(r.when)}</p>
    <div class="ab-row"><button class="ab" type="button" data-ra="remove">Remove</button><button class="ab" type="button" data-ra="warn">Warning</button><button class="ab" type="button" data-ra="restrict">Restrict</button><button class="ab" type="button" data-ra="ignore">Ignore</button></div></article>`;
}
function userHTML(m){
  const b=(act,on,off,st)=>`<button class="ab${m.status===st?' on':''}" type="button" data-ua="${act}" data-u="${esc(m.user)}">${m.status===st?on:off}</button>`;
  return `<article class="us"><div class="us-h"><p class="us-n">${esc(m.name)} - @${esc(m.user)}</p><span class="us-st">${ST_LABEL[m.status]}</span></div>
    <p class="us-m">${esc(m.email)} - IP ${m.ip}</p>
    <div class="ab-row">${b('suspend','Unsuspend','Suspend for 7 days','suspended')}${b('mute','Unmute','Mute','muted')}${b('ban','Unban','Ban','banned')}</div></article>`;
}

function pubHTML(){
  return `<div class="pub"><div class="pub-h">New Announcing <i>Author: Site</i></div>
    <div class="ad-sel"><select class="ad-in" id="pubType" aria-label="Announce type"><option value="">Announce Type (selection)</option><option>Announcement</option><option>Event</option><option>Maintenance</option><option>Update</option></select>${chev}</div>

}
function renderAdmin(){
  $('#adWel').innerHTML='Welcome, Administrator '+esc(PROFILE.name);
  const tab=(k,l)=>`<button class="ad-tab" type="button" data-tab="${k}" aria-selected="${adTab===k}">${l}</button>`;
  let c='';
  if(adTab==='reports'){const rs=DB.reports.filter(r=>r.open);c=`<div class="ad-list">${rs.length?rs.map(reportHTML).join(''):'<p class="ad-empty">No pending reports.</p>'}</div>`}
  else if(adTab==='users')c=`<div class="ad-list">${DB.members.map(userHTML).join('')}</div>`;
  else c=pubHTML();
  $('#adBody').innerHTML=adCards()+`<div class="ad-tabs">${tab('reports','Abuse Reports')}${tab('users','Users')}${tab('pub','Official Publish')}</div>`+c;
}
function openAdmin(tab){
  closeCrown();
  const cur=document.querySelector('.screen.active');
  if(cur&&cur.id!=='admin')adPrev={id:cur.id,appbar:!$('#appbar').classList.contains('off')};
  adTab=tab;renderAdmin();$('#adScroll').scrollTop=0;show('admin',1);setAppbar(false);
}
$('#adBack').addEventListener('click',()=>{show(adPrev.id,-1);setAppbar(adPrev.appbar);if(adPrev.id==='home')renderHome()});
function reportAct(id,act){
  const r=DB.reports.find(x=>x.id===id);if(!r)return;
  const m=memberOf(r.author);
  if(act==='remove'){
    if(r.kind==='Post'){DB.posts=DB.posts.filter(p=>p.id!==r.post);DB.reports.forEach(x=>{if(x.post===r.post)x.open=false})}
    else{const p=DB.posts.find(q=>q.id===r.post);if(p)delete p.last}
    toast(r.kind==='Post'?'Post removido (simulação).':'Comentário removido (simulação).');
  }else if(act==='warn'){if(m)m.warns++;toast(`Aviso enviado a @${r.author} (simulação).`)}
  else if(act==='restrict'){if(m)m.status='muted';toast(`@${r.author} foi restringido (mute, simulação).`)}
  else toast('Denúncia ignorada.');
  r.open=false;renderAdmin();renderFeed();
}
function userAct(u,act){
  const m=memberOf(u);if(!m)return;
  const t={suspend:'suspended',mute:'muted',ban:'banned'}[act];
  m.status=m.status===t?'active':t;
  const msg={suspended:'suspenso por 7 dias',muted:'silenciado (mute)',banned:'banido',active:'reativado'}[m.status];
  toast(`@${u} agora está ${msg} (simulação).`);
  renderAdmin();renderFeed();
}
function publishOfficial(){
  const ty=$('#pubType').value,t=$('#pubTitle').value.trim(),b=$('#pubBody').innerText.trim();
  if(!ty){toast('Escolha o tipo do anúncio.');return}
  if(!t||!b){toast('Preencha o título e o texto do anúncio.');return}
  const id=Math.max(...DB.posts.map(p=>p.id))+1;
  DB.posts.push({id,official:true,type:ty,date:new Date().toLocaleDateString('sv-SE'),name:'Letteralizing',user:'letteralizing',title:t,text:b,comments:0,likes:0,reposts:0});
  pubState.since=0;renderFeed();renderAdmin();
  toast('Post oficial publicado! Ele já está fixado no Feed.');
}
$('#adBody').addEventListener('click',e=>{
  const tb=e.target.closest('.ad-tab');if(tb){adTab=tb.dataset.tab;renderAdmin();return}
  const ra=e.target.closest('[data-ra]');if(ra){reportAct(+ra.closest('.rp').dataset.id,ra.dataset.ra);return}
  const ua=e.target.closest('[data-ua]');if(ua){userAct(ua.dataset.u,ua.dataset.ua);return}
  if(e.target.closest('#pubGo'))publishOfficial();
});
show('login');
